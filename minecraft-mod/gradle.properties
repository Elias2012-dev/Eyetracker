# Minecraft 26.2 / Loom 1.18 require JDK 25.
# Uncomment the next line and point it at your own JDK 25 if you don't have
# one on PATH (Gradle will not find it otherwise).
# org.gradle.java.home=C:/path/to/jdk-25

# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
version=1.0.0
group=dev.eyetrack

# Dependencies
fabric_api_version=0.161.0+26.2
